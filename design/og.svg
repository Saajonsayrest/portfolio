<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Source for public/og.png. Square canvas so the macOS renderer keeps scale. The 1200x630 card
       sits in the middle band (y 285 to 915). Regenerate with the recipe in README.md (a double hyphen
       is not allowed inside an XML comment, so the command cannot live here). Same look as the site:
       near-black canvas, the name in the accent, the role line in grey, one faint accent glow at the top. -->
  <defs>
    <radialGradient id="glow" cx="600" cy="220" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4dd4c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4dd4c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="#0a0a0a"/>
  <rect y="285" width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(0 285)">
    <g font-family="system-ui, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500">
      <text x="96" y="250" font-size="112" letter-spacing="-4" fill="#4dd4c4">Sajon Shrestha.</text>
      <text x="96" y="340" font-size="68" letter-spacing="-2" fill="#86868b">Mobile engineer in Kathmandu.</text>
    </g>
    <g font-family="system-ui, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="30" fill="#86868b">
      <text x="96" y="470">Flutter on top, native Kotlin underneath</text>
      <text x="96" y="530" fill="#f5f5f7">sajon.com.np</text>
    </g>
  </g>
</svg>
